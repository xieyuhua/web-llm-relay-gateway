# 网页大模型聚合网关配置

http_addr: ":8191"        # 监听地址，环境变量 HTTP_ADDR 可覆盖
ws_path: "/ws"            # WebSocket 升级路径
api_prefix: "/v1"         # OpenAI API 前缀
auth_token: "sk-demo-token"  # Bearer Token，环境变量 AUTH_TOKEN 可覆盖

# 模型路由表：对外 model 名 -> 插件实例 tag
models:
  - id: "chatgpt-web"
    owned_by: "chatgpt"
    tag: "chatgpt"
  - id: "claude-web"
    owned_by: "claude"
    tag: "claude"
  - id: "auto"
    owned_by: "relay"
    tag: "auto"

# 速率限制（全局，按 Token 维度在后续版本细化）
rate_limit:
  enabled: false
  qps: 10
  max_tasks: 50

# 单实例串行与排队控制：每个 WS 实例同一时刻仅 1 个客户端在网页操作，
# 其余请求进入队列等待，队列满后返回 503 系统繁忙。
concurrency:
  max_queue: 0                    # 每实例允许排队的最大请求数（不含正在执行的 1 个）；0=严格串行
  max_concurrent_per_instance: 1  # 单实例同时执行任务数（本系统强制为 1，保留字段）

# 单任务超时时间（秒）。从任务创建到完成（done/failed）的全局上限，
# 超时后任务被标记为 timeout 并失败。环境变量 TASK_TIMEOUT 可覆盖。
task_timeout: 120
